name: planning-with-files
version: 0.1.1
description: Hermes adapter for persistent project planning and selected context injection. Explicit catchup modes read same-project local session records for aggregate counts or bounded replay. Status controls are advisory. No network upload path.
author: planning-with-files contributors
provides_tools:
  - planning_with_files_init
  - planning_with_files_status
  - planning_with_files_check_complete
provides_hooks:
  - pre_llm_call
  - post_tool_call
